<svg xmlns="http://www.w3.org/2000/svg" width="640" height="176" viewBox="0 0 640 176" role="img" aria-labelledby="title desc">
<title id="title">Modeled tensor traffic with and without fusion</title><desc id="desc">Fusing bias addition and ReLU avoids an intermediate store and load. Graph traffic falls from 248 to 184 bytes.</desc>
<style>
:root{--paper:#ffffff;--surface:#f6f8fa;--ink:#20262b;--muted:#52606b;--accent:#17672e;--signal:#258b38;--wash:#e6f3e7;--rule:#b7c5bb;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--paper:#0d1117;--surface:#151a1e;--ink:#e6edf3;--muted:#a9b5bc;--accent:#92e798;--signal:#3cfe45;--wash:#193021;--rule:#48574d}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
.pulse,.focus{opacity:0}
@media all{
.pulse{stroke-dasharray:10 110;animation:pass 6s linear infinite;animation-delay:var(--delay,0s)}
.focus{animation:focus 6s ease-in-out infinite;animation-delay:var(--delay,0s)}
}
@keyframes pass{0%{stroke-dashoffset:11;opacity:0}3%{opacity:1}21%{stroke-dashoffset:-100;opacity:1}24%,100%{stroke-dashoffset:-101;opacity:0}}
@keyframes focus{0%,25%,100%{opacity:0}6%,18%{opacity:.82}}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="var(--accent)" stroke-width="1.8"/></marker></defs>
<rect x="0.75" y="0.75" width="638.5" height="174.5" rx="6" fill="var(--surface)" stroke="var(--rule)" stroke-width="1"/><text x="620" y="24" font-size="17" font-weight="500" fill="var(--muted)" text-anchor="end" dominant-baseline="central">Graph total</text><text x="18" y="61" font-size="21" font-weight="550" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Separate</text><rect x="130" y="40" width="80" height="41" rx="5" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5"/><text x="170.0" y="59.5" font-size="17" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">Add bias</text><path d="M210 60 H234" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="238" y="40" width="134" height="41" rx="5" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5"/><text x="305.0" y="59.5" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">Store / load</text><path d="M372 60 H396" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="400" y="40" width="89" height="41" rx="5" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5"/><text x="444.5" y="59.5" font-size="20" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">ReLU</text><text x="620" y="60" font-size="25" font-weight="650" fill="var(--muted)" text-anchor="end" dominant-baseline="central">248 B</text><path d="M18 99 H622" fill="none" stroke="var(--rule)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="18" y="133" font-size="21" font-weight="550" fill="var(--ink)" text-anchor="start" dominant-baseline="central">Fused</text><rect x="130" y="112" width="359" height="41" rx="5" fill="var(--wash)" stroke="var(--accent)" stroke-width="1.5"/><text x="309.5" y="131.5" font-size="20" font-weight="600" fill="var(--accent)" text-anchor="middle" dominant-baseline="central">Bias + ReLU</text><text x="620" y="132" font-size="25" font-weight="650" fill="var(--accent)" text-anchor="end" dominant-baseline="central">184 B</text><path class="pulse" style="--delay:0s" d="M210 60 H234" pathLength="100" stroke="var(--signal)" stroke-width="4" fill="none" stroke-linecap="round"/><rect class="focus" style="--delay:0.9s" x="238" y="40" width="134" height="41" rx="5" fill="none" stroke="var(--signal)" stroke-width="2.6"/><path class="pulse" style="--delay:1.8s" d="M372 60 H396" pathLength="100" stroke="var(--signal)" stroke-width="4" fill="none" stroke-linecap="round"/><rect class="focus" style="--delay:3s" x="130" y="112" width="359" height="41" rx="5" fill="none" stroke="var(--signal)" stroke-width="2.6"/>
</svg>