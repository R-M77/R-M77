<svg xmlns="http://www.w3.org/2000/svg" width="724" height="242" viewBox="0 0 724 242" role="img" aria-labelledby="title desc"><title id="title">Tensor fusion removes a 64-byte round trip</title><desc id="desc">Eight float32 values occupy 32 bytes. Fusing bias addition and ReLU removes a 32-byte write and read. Modeled graph traffic falls from 248 to 184 bytes.</desc><style>
:root{color-scheme:light dark;--bg:#f6f8f7;--ink:#152722;--muted:#495f55;--line:#bdcdc3;--signal:#18733e;--top:#d3ebd9;--edge:#659b72;--face:#9ac4a1;--side:#8ab596;--amber:#89500b;--track:#d9e3dd;--far:#92a99d}
@media(prefers-color-scheme:dark){:root{--bg:#101917;--ink:#eff7f2;--muted:#aebfb5;--line:#354940;--signal:#99eda7;--top:#29473a;--edge:#72aa85;--face:#1d392d;--side:#142a21;--amber:#f4b967;--track:#27382f;--far:#698678}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-variant-numeric:tabular-nums}
</style>
<rect x=".75" y=".75" width="722.5" height="240.5" rx="10" fill="var(--bg)" stroke="var(--line)"/>
<g transform="translate(8 0)"><text x="23" y="32" text-anchor="start" font-size="21" font-weight="650" fill="var(--ink)" >2 × 4 intermediate tensor</text><polygon points="107,154 303,126 303,140 107,168" fill="var(--face)" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round" /><polygon points="265,84 303,126 303,140 265,98" fill="var(--side)" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round" /><path d="M156 147v14" fill="none" stroke="var(--edge)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M205 140v14" fill="none" stroke="var(--edge)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M254 133v14" fill="none" stroke="var(--edge)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><polygon points="69,112 118,105 137,126 88,133" fill="var(--top)" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round" /><text x="103.0" y="124.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink)" >t₀</text><polygon points="118,105 167,98 186,119 137,126" fill="var(--top)" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round" /><text x="152.0" y="117.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink)" >t₁</text><polygon points="167,98 216,91 235,112 186,119" fill="var(--top)" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round" /><text x="201.0" y="110.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink)" >t₂</text><polygon points="216,91 265,84 284,105 235,112" fill="var(--top)" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round" /><text x="250.0" y="103.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink)" >t₃</text><polygon points="88,133 137,126 156,147 107,154" fill="var(--top)" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round" /><text x="122.0" y="145.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink)" >t₄</text><polygon points="137,126 186,119 205,140 156,147" fill="var(--top)" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round" /><text x="171.0" y="138.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink)" >t₅</text><polygon points="186,119 235,112 254,133 205,140" fill="var(--top)" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round" /><text x="220.0" y="131.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink)" >t₆</text><polygon points="235,112 284,105 303,126 254,133" fill="var(--top)" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round" /><text x="269.0" y="124.0" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink)" >t₇</text><path d="M26 76 H86 Q92 76 96 82 L107 98" fill="none" stroke="var(--amber)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M101 96l6 3 -1 -7" fill="none" stroke="var(--amber)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="66" text-anchor="start" font-size="18" font-weight="620" fill="var(--amber)" >32 B write</text><path d="M245 154 V174 Q245 180 252 180 H337" fill="none" stroke="var(--amber)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M332 175l6 5 -6 5" fill="none" stroke="var(--amber)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><text x="262" y="165" text-anchor="start" font-size="18" font-weight="620" fill="var(--amber)" >32 B read</text><text x="170" y="202" text-anchor="middle" font-size="14" font-weight="570" fill="var(--signal)" >Fused path</text><text x="25" y="217" text-anchor="start" font-size="17" font-weight="600" fill="var(--ink)" >Add bias</text><path d="M101 211 H239" fill="none" stroke="var(--signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M234 206l6 5 -6 5" fill="none" stroke="var(--signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="253" y="217" text-anchor="start" font-size="17" font-weight="600" fill="var(--ink)" >ReLU</text></g><path d="M377 20V221" fill="none" stroke="var(--line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="405" y="42" text-anchor="start" font-size="20" font-weight="550" fill="var(--muted)" >Fused graph</text><text x="402" y="103" text-anchor="start" font-size="62" font-weight="690" fill="var(--ink)" >−64 B</text><text x="405" y="132" text-anchor="start" font-size="19" font-weight="620" fill="var(--signal)" >25.8% less logical traffic</text><text x="405" y="162" text-anchor="start" font-size="17" font-weight="500" fill="var(--muted)" >Separate</text><text x="691" y="162" text-anchor="end" font-size="17" font-weight="600" fill="var(--ink)" >248 B</text><rect x="405" y="170" width="286" height="5" rx="2.5" fill="var(--track)"/><rect x="405" y="170" width="286.0" height="5" rx="2.5" fill="var(--far)"/><text x="405" y="206" text-anchor="start" font-size="17" font-weight="500" fill="var(--muted)" >Fused</text><text x="691" y="206" text-anchor="end" font-size="17" font-weight="600" fill="var(--ink)" >184 B</text><rect x="405" y="214" width="286" height="5" rx="2.5" fill="var(--track)"/><rect x="405" y="214" width="212.19354838709677" height="5" rx="2.5" fill="var(--signal)"/></svg>
